name: "Deploy Now: Deploy to IONOS"

on:
  - push
  - workflow_dispatch

concurrency: ${{ github.ref }}

jobs:
  deploy-now:
    name: deploy Logs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: v20

      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ec6286a1-dd48-4754-8281-44a3c1693be2
          action: retrieve

      - name: Build Node assets
        if: ${{ steps.project.outputs.deployment-enabled == 'true' }}
        env:
          CI: true
          SITE_URL: ${{ steps.project.outputs.site-url }}
        run: |
          npm install
          npm run build

      # Please do not touch the following action.
      - name: Store deployment content
        if: ${{ steps.project.outputs.deployment-enabled == 'true' }}
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ steps.project.outputs.project-id }}
          branch-id: ${{ steps.project.outputs.branch-id }}
          version: ${{ github.sha }}
          dist-folder: ./
          config-file: .deploy-now/config.yaml
          action: upload

      # Please do not touch the following action.
      - name: Deploy to IONOS
        if: ${{ steps.project.outputs.deployment-enabled == 'true' }}
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: ${{ steps.project.outputs.project-id }}
          branch-id: ${{ steps.project.outputs.branch-id }}
          deployment-info: ${{ steps.project.outputs.info }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}
