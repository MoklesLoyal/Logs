<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Log Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>Restricted Logs</h1>
      <p>Enter the password to view the Discord logs.</p>
      <input
        type="password"
        id="login-password"
        class="login-input"
        placeholder="Password"
        autocomplete="off"
      />
      <button id="login-button" class="login-button">Unlock</button>
      <p id="login-error" class="login-error hidden">Incorrect password.</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Discord Logs</h1>
        <p id="log-count">Loading logs...</p>
      </div>
      <input
        type="search"
        id="search"
        class="search"
        placeholder="Search logs..."
        autocomplete="off"
      />
      <nav id="log-list" class="log-list"></nav>
    </aside>
    <main class="viewer">
      <header class="viewer-header">
        <h2 id="viewer-title">Select a log</h2>
        <a
          id="open-link"
          href="#"
          target="_blank"
          rel="noreferrer"
          class="open-link hidden"
        >
          Open in new tab
        </a>
      </header>
      <iframe
        id="log-frame"
        class="log-frame"
        src="about:blank"
        title="Log viewer"
        sandbox="allow-same-origin allow-scripts"
      ></iframe>
      <div id="empty-state" class="empty-state">
        <p>Select a log from the sidebar to view it.</p>
      </div>
    </main>
  </div>

  <script>
    const LOGS = [
  "Pulse - 👑PULSE ADMIN👑 - ⚖️conclave [1427228092794933249].html",
  "Pulse - 👑PULSE ADMIN👑 - ⚪round-table [1324122792366444596].html",
  "Pulse - 👑PULSE ADMIN👑 - 📝attendance [1337912605116731444].html"
];
  </script>
  <script src="app.js"></script>
</body>
</html>
